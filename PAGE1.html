<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Physics Cube</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
    }

    canvas {
        display: block;
    }

    #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: Arial, sans-serif;
        z-index: 10;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 8px;
    }
</style>
</head>
<body>

<div id="info">
    Drag the cube with mouse/touch<br>
    Physics enabled
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const world = new CANNON.World({
    gravity: new CANNON.Vec3(0, -9.82, 0)
});

const groundMaterial = new CANNON.Material();
const cubeMaterial = new CANNON.Material();

const contactMaterial = new CANNON.ContactMaterial(
    groundMaterial,
    cubeMaterial,
    {
        friction: 0.4,
        restitution: 0.3
    }
);

world.addContactMaterial(contactMaterial);

const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.MeshStandardMaterial({
    color: 0x222222
});

const floorMesh = new THREE.Mesh(floorGeo, floorMat);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

const floorBody = new CANNON.Body({
    type: CANNON.Body.STATIC,
    shape: new CANNON.Plane(),
    material: groundMaterial
});

floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(floorBody);

const cubeGeo = new THREE.BoxGeometry(2, 2, 2);
const cubeMat = new THREE.MeshStandardMaterial({
    color: 0x00ffff,
    metalness: 0.3,
    roughness: 0.2
});

const cubeMesh = new THREE.Mesh(cubeGeo, cubeMat);
cubeMesh.castShadow = true;
scene.add(cubeMesh);

const cubeBody = new CANNON.Body({
    mass: 1,
    shape: new CANNON.Box(new CANNON.Vec3(1,1,1)),
    position: new CANNON.Vec3(0, 5, 0),
    material: cubeMaterial
});

world.addBody(cubeBody);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;

window.addEventListener('pointerdown', (event) => {

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObject(cubeMesh);

    if (intersects.length > 0) {
        dragging = true;
        controls.enabled = false;

        cubeBody.type = CANNON.Body.KINEMATIC;
        cubeBody.velocity.set(0,0,0);
    }
});

window.addEventListener('pointermove', (event) => {

    if (!dragging) return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const plane = new THREE.Plane(
        new THREE.Vector3(0, 1, 0),
        0
    );

    const point = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, point);

    cubeBody.position.x = point.x;
    cubeBody.position.z = point.z;
});

window.addEventListener('pointerup', () => {

    if (dragging) {
        dragging = false;
        controls.enabled = true;

        cubeBody.type = CANNON.Body.DYNAMIC;
    }
});

function animate() {
    requestAnimationFrame(animate);

    world.fixedStep();

    cubeMesh.position.copy(cubeBody.position);
    cubeMesh.quaternion.copy(cubeBody.quaternion);

    controls.update();

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
  </html>
